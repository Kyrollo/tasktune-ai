<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTune API — Documentation</title>
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f111a;
            color: #c9d1d9;
            line-height: 1.6;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }

        /* ========== LAYOUT ========== */
        .page-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #161b22;
            border-right: 1px solid #30363d;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #30363d;
        }

            .sidebar-header h1 {
                font-size: 20px;
                color: #58a6ff;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .sidebar-header .version {
                font-size: 11px;
                background: #238636;
                color: #fff;
                padding: 2px 8px;
                border-radius: 12px;
            }

            .sidebar-header p {
                font-size: 12px;
                color: #8b949e;
                margin-top: 6px;
            }

        .sidebar nav {
            padding: 12px 0;
        }

        .nav-group-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            padding: 12px 20px 6px;
            font-weight: 600;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 20px;
            font-size: 13px;
            color: #c9d1d9;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
        }

            .nav-link:hover {
                background: #1c2333;
                color: #58a6ff;
                text-decoration: none;
            }

            .nav-link.active {
                background: #1c2333;
                color: #58a6ff;
                border-left-color: #58a6ff;
            }

        .method-badge-sm {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            font-family: monospace;
            min-width: 36px;
            text-align: center;
        }

        /* Main */
        .main {
            margin-left: 280px;
            flex: 1;
        }

        .top-bar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

            .top-bar .base-url {
                font-family: 'Cascadia Code', 'Fira Code', monospace;
                font-size: 13px;
                background: #0d1117;
                padding: 6px 14px;
                border-radius: 6px;
                border: 1px solid #30363d;
                color: #7ee787;
            }

            .top-bar .health-btn {
                padding: 6px 16px;
                background: #238636;
                color: #fff;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
            }

                .top-bar .health-btn:hover {
                    background: #2ea043;
                }

        .content {
            padding: 32px;
            max-width: 1100px;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #161b22 0%, #1c2333 100%);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 48px 40px;
            margin-bottom: 32px;
            text-align: center;
        }

            .hero h2 {
                font-size: 32px;
                color: #f0f6fc;
                margin-bottom: 12px;
            }

            .hero p {
                font-size: 16px;
                color: #8b949e;
                max-width: 600px;
                margin: 0 auto 24px;
            }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .hero-stat {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px 24px;
            text-align: center;
        }

            .hero-stat .num {
                font-size: 28px;
                font-weight: 700;
                color: #58a6ff;
            }

            .hero-stat .label {
                font-size: 12px;
                color: #8b949e;
            }

        /* Sections */
        .api-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .api-section-header {
            padding: 20px 24px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

            .api-section-header:hover {
                background: #1c2333;
            }

            .api-section-header h3 {
                font-size: 18px;
                color: #f0f6fc;
                flex: 1;
            }

            .api-section-header .count {
                font-size: 12px;
                background: #30363d;
                color: #8b949e;
                padding: 2px 10px;
                border-radius: 12px;
            }

            .api-section-header .arrow {
                color: #8b949e;
                transition: transform 0.2s;
                font-size: 14px;
            }

            .api-section-header.open .arrow {
                transform: rotate(90deg);
            }

        .api-section-body {
            display: none;
        }

            .api-section-body.open {
                display: block;
            }

        /* Endpoint card */
        .endpoint {
            border-top: 1px solid #21262d;
            padding: 20px 24px;
        }

            .endpoint:first-child {
                border-top: none;
            }

        .endpoint-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .method-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
        }

        .method-GET {
            background: #1f3a2a;
            color: #7ee787;
        }

        .method-POST {
            background: #2a2017;
            color: #f0b856;
        }

        .method-PUT {
            background: #1a2640;
            color: #58a6ff;
        }

        .method-DELETE {
            background: #3d1a1a;
            color: #f85149;
        }

        .method-PATCH {
            background: #2a1740;
            color: #bc8cff;
        }

        .endpoint-path {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 14px;
            color: #f0f6fc;
        }

        .endpoint-auth {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #3d1a1a;
            color: #f85149;
        }

            .endpoint-auth.public {
                background: #1f3a2a;
                color: #7ee787;
            }

        .endpoint-desc {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 16px;
        }

        /* Sub sections inside endpoint */
        .endpoint-detail-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #58a6ff;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 12px;
        }

            .param-table th {
                text-align: left;
                padding: 8px 12px;
                background: #0d1117;
                color: #8b949e;
                font-weight: 600;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .param-table td {
                padding: 8px 12px;
                border-top: 1px solid #21262d;
                vertical-align: top;
            }

        .param-name {
            font-family: monospace;
            color: #f0f6fc;
            font-weight: 600;
        }

        .param-type {
            font-family: monospace;
            color: #bc8cff;
            font-size: 12px;
        }

        .param-required {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #3d1a1a;
            color: #f85149;
        }

        .param-optional {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            background: #1f3a2a;
            color: #7ee787;
        }

        /* Code block */
        .code-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre;
            color: #c9d1d9;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .code-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .json-key {
            color: #79c0ff;
        }

        .json-string {
            color: #a5d6ff;
        }

        .json-number {
            color: #f0b856;
        }

        .json-bool {
            color: #f85149;
        }

        .json-null {
            color: #8b949e;
        }

        /* Schema */
        .schema-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .schema-row {
            display: flex;
            gap: 12px;
            padding: 4px 0;
            font-size: 13px;
            align-items: baseline;
        }

            .schema-row + .schema-row {
                border-top: 1px solid #21262d;
                padding-top: 6px;
            }

        /* Responsive */
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: #c9d1d9;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

                .sidebar.open {
                    transform: translateX(0);
                }

            .main {
                margin-left: 0;
            }

            .hamburger {
                display: block;
            }

            .hero {
                padding: 32px 20px;
            }

            .content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <!-- ============ SIDEBAR ============ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>&#9889; TaskTune API <span class="version">v1.0</span></h1>
                <p>Complete REST API Reference</p>
            </div>
            <nav id="sidebar-nav">
                <!-- Populated by JS -->
            </nav>
        </aside>

        <!-- ============ MAIN ============ -->
        <div class="main">
            <div class="top-bar">
                <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
                <span class="base-url" id="baseUrlDisplay">https://localhost:44352/api</span>
                <button class="health-btn" onclick="checkHealth()">&#10003; Check Health</button>
            </div>

            <div class="content" id="content">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
// ============================================================
//  FULL API DEFINITION DATA
// ============================================================
const API = [

// ──────────────────────────────────────────────
// 1. HEALTH CHECK
// ──────────────────────────────────────────────
{
    group: "Health Check",
    icon: "&#128154;",
    endpoints: [
        {
            method: "GET",
            path: "/api/health",
            auth: "Public",
            summary: "Basic health check — confirms the API is running.",
            params: [],
            response: {
                status: 200,
                body: `{
  "status": "Healthy",
  "timestamp": "2026-03-18T14:30:00Z",
  "version": "1.0.0"
}`
            },
            schema: [
                { name: "status", type: "string", desc: "\"Healthy\" if the API is running" },
                { name: "timestamp", type: "datetime", desc: "Current server UTC time" },
                { name: "version", type: "string", desc: "API version number" }
            ]
        },
        {
            method: "GET",
            path: "/api/health/db",
            auth: "Public",
            summary: "Database connectivity check — attempts to open a connection and query the database.",
            params: [],
            response: {
                status: 200,
                body: `{
  "status": "Connected",
  "database": "TaskTuneAIDatabase",
  "server": "(LocalDB)\\\\MSSQLLocalDB",
  "companyCount": 3
}`
            },
            schema: [
                { name: "status", type: "string", desc: "\"Connected\" or \"Disconnected\"" },
                { name: "database", type: "string", desc: "Database name" },
                { name: "server", type: "string", desc: "SQL Server instance" },
                { name: "companyCount", type: "int", desc: "Number of companies in the database" }
            ]
        }
    ]
},

// ──────────────────────────────────────────────
// 2. AUTHENTICATION
// ──────────────────────────────────────────────
{
    group: "Authentication",
    icon: "&#128274;",
    endpoints: [
        {
            method: "POST",
            path: "/api/auth/login",
            auth: "Public",
            summary: "Authenticate a user with email and password. Returns a JWT access token and a refresh token.",
            params: [
                { name: "email", type: "string", required: true, location: "body", desc: "User's registered email address" },
                { name: "password", type: "string", required: true, location: "body", desc: "User's plaintext password (hashed via BCrypt on server)" }
            ],
            requestBody: `{
  "email": "admin@tasktune.com",
  "password": "Admin@123"
}`,
            response: {
                status: 200,
                body: `{
  "token": "eyJhbGciOiJIUzI1NiIs...",
  "refreshToken": "c3VwZXItcmFuZG9t...",
  "expiresAt": "2026-03-18T15:30:00Z",
  "user": {
    "userId": 1,
    "fullName": "Ahmed Admin",
    "email": "admin@tasktune.com",
    "role": 5,
    "roleName": "Admin",
    "companyId": 1,
    "companyName": "TaskTune Corp",
    "departmentId": 1,
    "positionId": 1
  }
}`
            },
            errorResponses: [
                { status: 400, desc: "Missing email or password" },
                { status: 401, desc: "Invalid email or password" },
                { status: 403, desc: "Account is deactivated" }
            ],
            schema: [
                { name: "token", type: "string", desc: "JWT access token (valid for 60 min)" },
                { name: "refreshToken", type: "string", desc: "Refresh token (valid for 7 days)" },
                { name: "expiresAt", type: "datetime", desc: "Token expiration timestamp" },
                { name: "user", type: "object", desc: "Authenticated user profile" },
                { name: "user.userId", type: "int", desc: "User ID" },
                { name: "user.fullName", type: "string", desc: "Full name" },
                { name: "user.email", type: "string", desc: "Email address" },
                { name: "user.role", type: "int", desc: "Role level (0–5)" },
                { name: "user.roleName", type: "string", desc: "Role display name" },
                { name: "user.companyId", type: "int", desc: "Company ID" },
                { name: "user.companyName", type: "string", desc: "Company name" },
                { name: "user.departmentId", type: "int?", desc: "Department ID (nullable)" },
                { name: "user.positionId", type: "int?", desc: "Position ID (nullable)" }
            ]
        },
        {
            method: "POST",
            path: "/api/auth/refresh",
            auth: "Public",
            summary: "Exchange a refresh token for a new JWT access token.",
            params: [
                { name: "refreshToken", type: "string", required: true, location: "body", desc: "Valid refresh token from previous login or refresh" }
            ],
            requestBody: `{
  "refreshToken": "c3VwZXItcmFuZG9t..."
}`,
            response: {
                status: 200,
                body: `{
  "token": "eyJhbGciOiJIUzI1NiIs...",
  "refreshToken": "bmV3LXJlZnJlc2g...",
  "expiresAt": "2026-03-18T16:30:00Z"
}`
            },
            errorResponses: [
                { status: 401, desc: "Invalid or expired refresh token" }
            ],
            schema: [
                { name: "token", type: "string", desc: "New JWT access token" },
                { name: "refreshToken", type: "string", desc: "New refresh token" },
                { name: "expiresAt", type: "datetime", desc: "New expiration time" }
            ]
        },
        {
            method: "POST",
            path: "/api/auth/logout",
            auth: "JWT Required",
            summary: "Invalidate the current refresh token.",
            params: [
                { name: "refreshToken", type: "string", required: true, location: "body", desc: "Refresh token to revoke" }
            ],
            requestBody: `{
  "refreshToken": "c3VwZXItcmFuZG9t..."
}`,
            response: {
                status: 200,
                body: `{
  "message": "Logged out successfully"
}`
            },
            schema: [
                { name: "message", type: "string", desc: "Confirmation message" }
            ]
        },
        {
            method: "POST",
            path: "/api/auth/forgot-password",
            auth: "Public",
            summary: "Request a password reset link (sends email — placeholder implementation).",
            params: [
                { name: "email", type: "string", required: true, location: "body", desc: "Registered email address" }
            ],
            requestBody: `{
  "email": "user@tasktune.com"
}`,
            response: {
                status: 200,
                body: `{
  "message": "If this email exists, a reset link has been sent."
}`
            },
            schema: [
                { name: "message", type: "string", desc: "Generic response (no info leak)" }
            ]
        }
    ]
},

// ──────────────────────────────────────────────
// 3. USERS
// ──────────────────────────────────────────────
{
    group: "Users",
    icon: "&#128100;",
    endpoints: [
        {
            method: "GET",
            path: "/api/users",
            auth: "JWT Required — Manager+",
            summary: "Get a paginated list of users in your company. Supports search and role filtering.",
            params: [
                { name: "page", type: "int", required: false, location: "query", desc: "Page number (default 1)" },
                { name: "pageSize", type: "int", required: false, location: "query", desc: "Items per page (default 20, max 100)" },
                { name: "search", type: "string", required: false, location: "query", desc: "Search by name or email" },
                { name: "role", type: "int", required: false, location: "query", desc: "Filter by role (0–5)" },
                { name: "departmentId", type: "int", required: false, location: "query", desc: "Filter by department" },
                { name: "isActive", type: "bool", required: false, location: "query", desc: "Filter by active status" }
            ],
            response: {
                status: 200,
                body: `{
  "items": [
    {
      "userId": 1,
      "fullName": "Ahmed Admin",
      "email": "admin@tasktune.com",
      "role": 5,
      "roleName": "Admin",
      "departmentName": "Engineering",
      "positionName": "CTO",
      "isActive": true,
      "createdAt": "2026-01-10T08:00:00Z"
    }
  ],
  "totalCount": 25,
  "page": 1,
  "pageSize": 20,
  "totalPages": 2
}`
            },
            schema: [
                { name: "items", type: "array", desc: "Array of user summary objects" },
                { name: "items[].userId", type: "int", desc: "Unique user identifier" },
                { name: "items[].fullName", type: "string", desc: "User's full name" },
                { name: "items[].email", type: "string", desc: "Email address" },
                { name: "items[].role", type: "int", desc: "Role level: 0=Employee, 1=TeamLead, 2=Supervisor, 3=Manager, 4=CEO, 5=Admin" },
                { name: "items[].roleName", type: "string", desc: "Human-readable role name" },
                { name: "items[].departmentName", type: "string?", desc: "Department name" },
                { name: "items[].positionName", type: "string?", desc: "Position title" },
                { name: "items[].isActive", type: "bool", desc: "Whether the account is active" },
                { name: "items[].createdAt", type: "datetime", desc: "Account creation date" },
                { name: "totalCount", type: "int", desc: "Total matching records" },
                { name: "page", type: "int", desc: "Current page" },
                { name: "pageSize", type: "int", desc: "Items per page" },
                { name: "totalPages", type: "int", desc: "Total number of pages" }
            ]
        },
        {
            method: "GET",
            path: "/api/users/{id}",
            auth: "JWT Required",
            summary: "Get detailed profile of a single user. Employees can only view themselves.",
            params: [
                { name: "id", type: "int", required: true, location: "path", desc: "User ID" }
            ],
            response: {
                status: 200,
                body: `{
  "userId": 1,
  "fullName": "Ahmed Admin",
  "email": "admin@tasktune.com",
  "phoneNumber": "+201234567890",
  "role": 5,
  "roleName": "Admin",
  "companyId": 1,
  "companyName": "TaskTune Corp",
  "departmentId": 1,
  "departmentName": "Engineering",
  "positionId": 1,
  "positionName": "CTO",
  "isActive": true,
  "createdAt": "2026-01-10T08:00:00Z",
  "updatedAt": "2026-03-01T12:00:00Z"
}`
            },
            errorResponses: [
                { status: 403, desc: "Not authorized to view this user" },
                { status: 404, desc: "User not found" }
            ],
            schema: [
                { name: "userId", type: "int", desc: "Unique user identifier" },
                { name: "fullName", type: "string", desc: "Full name" },
                { name: "email", type: "string", desc: "Email address" },
                { name: "phoneNumber", type: "string?", desc: "Phone number" },
                { name: "role", type: "int", desc: "Role level (0–5)" },
                { name: "roleName", type: "string", desc: "Role display name" },
                { name: "companyId", type: "int", desc: "Company ID" },
                { name: "companyName", type: "string", desc: "Company name" },
                { name: "departmentId", type: "int?", desc: "Department ID" },
                { name: "departmentName", type: "string?", desc: "Department name" },
                { name: "positionId", type: "int?", desc: "Position ID" },
                { name: "positionName", type: "string?", desc: "Position title" },
                { name: "isActive", type: "bool", desc: "Account active status" },
                { name: "createdAt", type: "datetime", desc: "Creation timestamp" },
                { name: "updatedAt", type: "datetime?", desc: "Last update timestamp" }
            ]
        },
        {
            method: "POST",
            path: "/api/users",
            auth: "JWT Required — Admin only",
            summary: "Create a new user account. Password is hashed with BCrypt before storage.",
            params: [
                { name: "fullName", type: "string", required: true, location: "body", desc: "Full name" },

function renderSidebar() {
    const nav = document.getElementById('sidebar-nav');
    let html = `<div class="nav-link" onclick="scrollTo('hero')" id="nav-overview">Overview</div>`;
    API.forEach((group, gi) => {
        html += `<div class="nav-group-title">${group.icon} ${group.group}</div>`;
        group.endpoints.forEach((ep, ei) => {
            const id = `ep-${gi}-${ei}`;
            const methodClass = `method-${ep.method}`;
            html += `<div class="nav-link" onclick="scrollTo('${id}')" id="nav-${id}">
                <span class="method-badge-sm ${methodClass}">${ep.method}</span>
                <span>${ep.path.replace('/api/', '')}</span>
            </div>`;
        });
    });
    nav.innerHTML = html;
}

function renderContent() {
    const content = document.getElementById('content');
    let totalEndpoints = 0;
    API.forEach(g => totalEndpoints += g.endpoints.length);

    let html = `
    <div class="hero" id="hero">
        <h2>&#9889; TaskTune API Documentation</h2>
        <p>Complete REST API reference for the TaskTune AI-powered task management platform. All endpoints return JSON.</p>
        <div class="hero-stats">
            <div class="hero-stat"><div class="num">${API.length}</div><div class="label">API Groups</div></div>
            <div class="hero-stat"><div class="num">${totalEndpoints}</div><div class="label">Endpoints</div></div>
            <div class="hero-stat"><div class="num">JWT</div><div class="label">Auth Method</div></div>
            <div class="hero-stat"><div class="num">.NET 4.8</div><div class="label">Framework</div></div>
        </div>
    </div>

    <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px 24px;margin-bottom:24px;">
        <h3 style="color:#f0f6fc;margin-bottom:8px;">&#128273; Authentication</h3>
        <p style="font-size:14px;color:#8b949e;">
            Most endpoints require a JWT token. After calling <code style="color:#7ee787;">POST /api/auth/login</code>,
            include the token in every request header:
        </p>
        <div class="code-block" style="margin-top:12px;">Authorization: Bearer eyJhbGciOiJIUzI1NiIs...</div>
        <p style="font-size:13px;color:#8b949e;margin-top:8px;">
            <strong style="color:#f0f6fc;">Role levels:</strong>
            0 = Employee &nbsp;|&nbsp; 1 = TeamLead &nbsp;|&nbsp; 2 = Supervisor &nbsp;|&nbsp; 3 = Manager &nbsp;|&nbsp; 4 = CEO &nbsp;|&nbsp; 5 = Admin
        </p>
    </div>`;

    API.forEach((group, gi) => {
        html += `<div class="api-section">
            <div class="api-section-header open" onclick="toggleSection(this)">
                <h3>${group.icon} ${group.group}</h3>
                <span class="count">${group.endpoints.length} endpoint${group.endpoints.length > 1 ? 's' : ''}</span>
                <span class="arrow">&#9654;</span>
            </div>
            <div class="api-section-body open">`;

        group.endpoints.forEach((ep, ei) => {
            const id = `ep-${gi}-${ei}`;
            const methodClass = `method-${ep.method}`;
            const authBadge = ep.auth === 'Public'
                ? '<span class="endpoint-auth public">Public</span>'
                : `<span class="endpoint-auth">&#128274; ${ep.auth}</span>`;

            html += `<div class="endpoint" id="${id}">
                <div class="endpoint-header">
                    <span class="method-badge ${methodClass}">${ep.method}</span>
                    <span class="endpoint-path">${ep.path}</span>
                    ${authBadge}
                </div>
                <div class="endpoint-desc">${ep.summary}</div>`;

            // Parameters
            if (ep.params && ep.params.length > 0) {
                html += `<div class="endpoint-detail-title">Parameters</div>
                <table class="param-table">
                    <thead><tr><th>Name</th><th>Type</th><th>In</th><th>Required</th><th>Description</th></tr></thead>
                    <tbody>`;
                ep.params.forEach(p => {
                    const reqBadge = p.required
                        ? '<span class="param-required">Required</span>'
                        : '<span class="param-optional">Optional</span>';
                    html += `<tr>
                        <td><span class="param-name">${p.name}</span></td>
                        <td><span class="param-type">${p.type}</span></td>
                        <td>${p.location}</td>
                        <td>${reqBadge}</td>
                        <td>${p.desc}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            // Request body
            if (ep.requestBody) {
                html += `<div class="endpoint-detail-title">Request Body Example</div>
                <div class="code-block">${syntaxHighlight(ep.requestBody)}</div>`;
            }

            // Success response
            if (ep.response) {
                html += `<div class="endpoint-detail-title">Response ${ep.response.status ? `(${ep.response.status})` : ''}</div>
                <div class="code-block">${syntaxHighlight(ep.response.body)}</div>`;
            }

            // Error responses
            if (ep.errorResponses && ep.errorResponses.length > 0) {
                html += `<div class="endpoint-detail-title">Error Responses</div>
                <table class="param-table">
                    <thead><tr><th>Status</th><th>Description</th></tr></thead>
                    <tbody>`;
                ep.errorResponses.forEach(e => {
                    html += `<tr><td><span class="method-badge method-DELETE" style="min-width:40px">${e.status}</span></td><td>${e.desc}</td></tr>`;
                });
                html += `</tbody></table>`;
            }

            // Schema
            if (ep.schema && ep.schema.length > 0) {
                html += `<div class="endpoint-detail-title">Response Schema</div>
                <table class="param-table">
                    <thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead>
                    <tbody>`;
                ep.schema.forEach(s => {
                    html += `<tr>
                        <td><span class="param-name">${s.name}</span></td>
                        <td><span class="param-type">${s.type}</span></td>
                        <td>${s.desc}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            html += `</div>`; // endpoint
        });

        html += `</div></div>`; // section-body, section
    });

    content.innerHTML = html;
}

function toggleSection(header) {
    header.classList.toggle('open');
    const body = header.nextElementSibling;
    body.classList.toggle('open');
}

function scrollTo(id) {
    const el = document.getElementById(id);
    if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Close mobile sidebar
        document.getElementById('sidebar').classList.remove('open');
    }
}

function syntaxHighlight(json) {
    return json
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, function(match) {
            if (/:$/.test(match)) {
                return '<span class="json-key">' + match + '</span>';
            }
            return '<span class="json-string">' + match + '</span>';
        })
        .replace(/\b(-?\d+(\.\d+)?)\b/g, '<span class="json-number">$1</span>')
        .replace(/\b(true|false)\b/g, '<span class="json-bool">$1</span>')
        .replace(/\bnull\b/g, '<span class="json-null">null</span>');
}

async function checkHealth() {
    const baseUrl = window.location.origin;
    try {
        const resp = await fetch(baseUrl + '/api/health');
        const data = await resp.json();
        alert('API Status: ' + data.status + '\n\nTry /api/health/db for database check.');
    } catch (e) {
        alert('Could not reach API.\n\n' + e.message);
    }
}
