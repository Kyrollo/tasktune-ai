name: TaskTune CI

on:
  push:
    branches:
      - main-reindex
      - implementation/**
  pull_request:
    branches:
      - main-reindex
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasktune-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: .NET API build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build API
        run: dotnet build tasktune-backend/TaskTuneAPI/TaskTune.API/TaskTune.API.csproj --configuration Release

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasktune-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasktune-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  python-validation:
    name: Python source validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all agent modules
        run: python -m compileall -q tasktune-agents
