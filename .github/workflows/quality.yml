name: TaskTune quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and auth regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API
        run: dotnet restore tasktune-backend/TaskTuneAPI/TaskTune.API/TaskTune.API.csproj
      - name: Build API
        run: dotnet build tasktune-backend/TaskTuneAPI/TaskTune.API/TaskTune.API.csproj --configuration Release --no-restore
      - name: Run authentication regression tests
        run: dotnet test tasktune-backend/TaskTuneAPI/TaskTune.Tests/TaskTune.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasktune-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasktune-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agents:
    name: Python agent syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: python -m compileall -q tasktune-agents
